<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ejercicios al azar</title><style>
:root{--bg:#f3f6fb;--hoja:#fff;--tinta:#0f1b2d;--suave:#52637a;--linea:#d7e0ec;--c:#0891b2;--cs:color-mix(in srgb,var(--c) 12%,var(--hoja))}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--hoja:#131c2e;--tinta:#e8eef8;--suave:#9aabc4;--linea:#25324a;--c:#4fd1e8;--cs:color-mix(in srgb,var(--c) 16%,var(--hoja));color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinta);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
.hero{background:var(--c);color:#fff;padding:28px 0 26px;margin-bottom:24px}
@media (prefers-color-scheme:dark){.hero{color:#0b1220}}
.hero .wrap{padding-bottom:0}
.hero h1{margin:0;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.15}
.hero p{margin:6px 0 0;opacity:.92}
.back{display:inline-block;color:inherit;text-decoration:none;font-weight:600;font-size:.92rem;padding:8px 0;margin-bottom:6px;opacity:.95}
.back:hover{text-decoration:underline}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
a.card,div.card{display:block;position:relative;background:var(--hoja);border:1px solid var(--linea);border-top:6px solid var(--c);border-radius:12px;padding:16px 18px;color:inherit;text-decoration:none;min-height:104px}
a.card:hover,a.card:focus-visible{box-shadow:0 6px 20px rgb(0 0 0/.12);transform:translateY(-2px);outline:none}
a.card{transition:transform .15s,box-shadow .15s}
.card b{display:block;font-size:1.1rem;color:var(--c);margin-bottom:2px}
.card span{color:var(--suave);font-size:.9rem}
.card .ico{position:absolute;right:14px;top:12px;font:700 1.3rem ui-monospace,Consolas,monospace;color:var(--c);opacity:.35}
.card.off{opacity:.5;border-top-style:dashed}
details.fold{position:relative;margin:32px 0 18px;--f:color-mix(in srgb,var(--c) 20%,var(--hoja))}
details.fold>summary{list-style:none;cursor:pointer;position:relative;display:flex;align-items:center;gap:12px;min-height:72px;padding:16px 18px;background:var(--f);border:2px solid var(--c);border-radius:0 12px 12px 12px}
details.fold>summary::before{content:"";position:absolute;left:-2px;bottom:100%;width:min(46%,170px);height:17px;background:var(--c);border-radius:10px 0 0 0;clip-path:polygon(0 0,84% 0,100% 100%,0 100%)}
details.fold>summary:focus-visible{outline:3px solid var(--tinta);outline-offset:2px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary>svg{display:none}
details.fold>summary b{font-size:1.15rem}
details.fold>summary small{display:block;color:var(--suave);font-size:.88rem}
details.fold>summary::after{content:"▾";margin-left:auto;color:var(--tinta);transition:transform .2s}
details.fold[open]>summary{border-radius:0 12px 0 0}
details.fold[open]>summary::after{transform:rotate(180deg)}
.in{padding:14px 16px 18px;background:var(--hoja);border:2px solid var(--c);border-top:0;border-radius:0 0 12px 12px}
.in h3{margin:14px 0 8px;font-size:.95rem;color:var(--c);display:flex;align-items:center;gap:8px}
.in h3 svg{width:20px;height:20px}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
a.t,div.t{display:block;background:var(--cs);border:1px solid var(--linea);border-radius:10px;padding:12px 14px;color:inherit;text-decoration:none;min-height:64px}
a.t:hover,a.t:focus-visible{border-color:var(--c);outline:none}
.t b{display:block;font-size:.98rem}
.t span{color:var(--suave);font-size:.82rem}
div.t{opacity:.5;border-style:dashed}
.sub{position:relative;margin-top:26px;padding:6px 12px 14px;background:var(--cs);border:1.5px solid var(--c);border-radius:0 10px 10px 10px}
.sub::before{content:"";position:absolute;left:-1.5px;bottom:100%;width:min(46%,130px);height:13px;background:var(--c);border-radius:8px 0 0 0;clip-path:polygon(0 0,84% 0,100% 100%,0 100%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.fold .fold{margin:26px 0 12px}.in p{margin:0 0 12px}.in h3{font-size:1.05rem;color:var(--c);margin:20px 0 8px;display:block}.in ul,.in ol{margin:0 0 12px;padding-left:22px}.in li{margin-bottom:6px}.in li ul{margin-top:6px}
.in code{font-family:ui-monospace,Consolas,monospace;background:var(--cs);border-radius:5px;padding:1px 5px}.in a{color:var(--c)}
.nota{background:var(--cs);border-left:5px solid var(--c);border-radius:8px;padding:10px 12px}
figure{margin:12px 0 16px}figure img{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--linea);border-radius:8px}figcaption{color:var(--suave);font-size:.85rem;margin-top:5px}
figure.one{max-width:560px}figure.small{max-width:280px}pre.code{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px 14px;overflow-x:auto;font:.86rem/1.5 ui-monospace,Consolas,monospace;margin:0 0 14px}.no{color:#b91c1c}.si{color:#15803d}@media (prefers-color-scheme:dark){.no{color:#f87171}.si{color:#4ade80}}.sol{margin:8px 0}.sol summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;color:var(--c)}li figure{margin-top:10px}.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:12px 0}.figs figure{margin:0}
h3.ico{display:flex!important;align-items:center;gap:10px}h3.ico img{width:40px;height:auto}
table.g{width:100%;border-collapse:collapse;margin:0 0 14px}@media (max-width:620px){table.g{display:block;overflow-x:auto}}table.g th,table.g td{border:1px solid var(--linea);padding:8px 10px;text-align:left;vertical-align:top;overflow-wrap:break-word}table.g th{background:var(--cs)}

.fold .fold{margin:26px 0 12px}.in p{margin:0 0 12px}.in h3{font-size:1.05rem;color:var(--c);margin:20px 0 8px;display:block}.in ul,.in ol{margin:0 0 12px;padding-left:22px}.in li{margin-bottom:6px}.in li ul{margin-top:6px}
.in code{font-family:ui-monospace,Consolas,monospace;background:var(--cs);border-radius:5px;padding:1px 5px}.in a{color:var(--c)}
.nota{background:var(--cs);border-left:5px solid var(--c);border-radius:8px;padding:10px 12px}

figure.one{max-width:560px}figure.small{max-width:280px}pre.code{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px 14px;overflow-x:auto;font:.86rem/1.5 ui-monospace,Consolas,monospace;margin:0 0 14px}.no{color:#b91c1c}.si{color:#15803d}@media (prefers-color-scheme:dark){.no{color:#f87171}.si{color:#4ade80}}.sol{margin:8px 0}.sol summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;color:var(--c)}li figure{margin-top:10px}.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:12px 0}.figs figure{margin:0}
h3.ico{display:flex!important;align-items:center;gap:10px}h3.ico img{width:40px;height:auto}
table.g{width:100%;border-collapse:collapse;margin:0 0 14px}@media (max-width:620px){table.g{display:block;overflow-x:auto}}table.g th,table.g td{border:1px solid var(--linea);padding:8px 10px;text-align:left;vertical-align:top;overflow-wrap:break-word}table.g th{background:var(--cs)}

.pasos{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 14px}.pasos span{background:var(--cs);border:1px solid var(--linea);border-radius:8px;padding:6px 10px;font-weight:600}.pasos span+span::before{content:"→ ";color:var(--c)}
figure.mini{max-width:110px}figure.flujo{max-width:min(100%,520px)}figure.flujo img{background:#fff}.sol{border:1px solid var(--linea);border-radius:10px;padding:0 12px;margin:12px 0}.sol>div{padding:0 0 4px}.fold .in>p:first-child{margin-top:4px}p.nota{margin:12px 0}
pre.code{white-space:pre;overflow-x:auto}

.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 14px}
.ctl select,.ctl button,.ctl a.bt{font:inherit;font-weight:600;min-height:46px;padding:8px 14px;border:1px solid var(--linea);border-radius:10px;background:var(--hoja);color:var(--tinta);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.ctl select{flex:1 1 180px;max-width:260px}
.ctl .pri{background:var(--c);border-color:var(--c);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .ctl .pri{color:#0b1220}}:root[data-theme=dark] .ctl .pri{color:#0b1220}
.ej{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:16px 18px}
.ej h2{margin:6px 0 8px;font-size:1.3rem}.ej p{margin:0 0 10px}.ej ul{margin:0 0 12px;padding-left:22px}.ej li{margin-bottom:5px}
.niv{display:inline-block;font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--cs)}
.ej code{font-family:ui-monospace,Consolas,monospace;background:var(--cs);border-radius:5px;padding:1px 5px}
.ej .intro{color:var(--suave);margin:0 0 14px}
</style><link rel="stylesheet" href="../fondo.css"><link rel="stylesheet" href="explica.css"><script src="../tema.js"></script><script src="../acceso.js"></script></head><body><div class="hero"><div class="wrap"><a class="back" href="index.html">← Volver</a><h1>Ejercicios al azar</h1></div></div><div class="wrap">
<p class="intro" style="color:var(--suave);margin:0 0 14px">Ejercicios con el formato de las prácticas de clase: enunciado, datos del problema y aspectos a tener en cuenta. Intenta resolverlo antes de abrir la solución; después tienes una explicación comentada línea a línea.</p>
<div class="ctl"><label for="niv" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Dificultad</label><select id="niv"><option value="">Cualquier dificultad</option><option value="F">Fácil</option><option value="M">Medio</option><option value="D">Difícil</option></select><button type="button" class="pri" id="otro">Otro ejercicio</button><a class="bt" href="practica-pseint.html">Practicarlo en el editor</a></div>
<div class="ej" id="ej" aria-live="polite"></div></div>
<script src="pseint.js"></script><script src="ejercicios-azar.js"></script><script src="explica.js"></script><script src="ejercicios-clase.js"></script><script src="clase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script><script src="../supabase-config.js"></script><script src="../progreso.js" data-pagina="entornos-de-desarrollo" data-claves="ed:*"></script>
</body></html>
