<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practica con PSeInt</title><style>
:root{--bg:#f3f6fb;--hoja:#fff;--tinta:#0f1b2d;--suave:#52637a;--linea:#d7e0ec;--c:#0891b2;--cs:color-mix(in srgb,var(--c) 12%,var(--hoja))}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinta);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}

.back{display:inline-block;color:inherit;text-decoration:none;font-weight:600;font-size:.92rem;padding:8px 0;margin-bottom:6px;opacity:.95}

.card.off{opacity:.5;border-top-style:dashed}
details.fold{position:relative;margin:32px 0 18px;--f:color-mix(in srgb,var(--c) 20%,var(--hoja))}
details.fold>summary{list-style:none;cursor:pointer;position:relative;display:flex;align-items:center;gap:12px;min-height:72px;padding:16px 18px;background:var(--f);border:2px solid var(--c);border-radius:0 12px 12px 12px}

details.fold[open]>summary{border-radius:0 12px 0 0}
details.fold[open]>summary::after{transform:rotate(180deg)}
.in{padding:14px 16px 18px;background:var(--hoja);border:2px solid var(--c);border-top:0;border-radius:0 0 12px 12px}
.in h3{margin:14px 0 8px;font-size:.95rem;color:var(--c);display:flex;align-items:center;gap:8px}
.in h3 svg{width:20px;height:20px}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
a.t,div.t{display:block;background:var(--cs);border:1px solid var(--linea);border-radius:10px;padding:12px 14px;color:inherit;text-decoration:none;min-height:64px}
a.t:hover,a.t:focus-visible{border-color:var(--c);outline:none}
.t b{display:block;font-size:.98rem}
.t span{color:var(--suave);font-size:.82rem}
div.t{opacity:.5;border-style:dashed}
.sub{position:relative;margin-top:26px;padding:6px 12px 14px;background:var(--cs);border:1.5px solid var(--c);border-radius:0 10px 10px 10px}
.sub::before{content:"";position:absolute;left:-1.5px;bottom:100%;width:min(46%,130px);height:13px;background:var(--c);border-radius:8px 0 0 0;clip-path:polygon(0 0,84% 0,100% 100%,0 100%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.fold .fold{margin:26px 0 12px}.in p{margin:0 0 12px}.in h3{font-size:1.05rem;color:var(--c);margin:20px 0 8px;display:block}.in ul,.in ol{margin:0 0 12px;padding-left:22px}.in li{margin-bottom:6px}.in li ul{margin-top:6px}
.in code{font-family:ui-monospace,Consolas,monospace;background:var(--cs);border-radius:5px;padding:1px 5px}.in a{color:var(--c)}
.nota{background:var(--cs);border-left:5px solid var(--c);border-radius:8px;padding:10px 12px}
figure{margin:12px 0 16px}figure img{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--linea);border-radius:8px}figcaption{color:var(--suave);font-size:.85rem;margin-top:5px}
figure.one{max-width:560px}figure.small{max-width:280px}pre.code{background:#0f172a;color:#e2e8f0;border-radius:10px;padding:12px 14px;overflow-x:auto;font:.86rem/1.5 ui-monospace,Consolas,monospace;margin:0 0 14px}.no{color:#b91c1c}.si{color:#15803d}@media (prefers-color-scheme:dark){.no{color:#f87171}.si{color:#4ade80}}.sol{margin:8px 0}.sol summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;color:var(--c)}li figure{margin-top:10px}.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px;margin:12px 0}.figs figure{margin:0}
h3.ico{display:flex!important;align-items:center;gap:10px}h3.ico img{width:40px;height:auto}
table.g{width:100%;border-collapse:collapse;margin:0 0 14px}@media (max-width:620px){table.g{display:block;overflow-x:auto}}table.g th,table.g td{border:1px solid var(--linea);padding:8px 10px;text-align:left;vertical-align:top;overflow-wrap:break-word}table.g th{background:var(--cs)}

.pasos{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0 0 14px}.pasos span{background:var(--cs);border:1px solid var(--linea);border-radius:8px;padding:6px 10px;font-weight:600}.pasos span+span::before{content:"→ ";color:var(--c)}
figure.mini{max-width:110px}figure.flujo{max-width:min(100%,520px)}figure.flujo img{background:#fff}.sol{border:1px solid var(--linea);border-radius:10px;padding:0 12px;margin:12px 0}.sol>div{padding:0 0 4px}.fold .in>p:first-child{margin-top:4px}p.nota{margin:12px 0}
pre.code{white-space:pre;overflow-x:auto}

.mod{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}.mod button,.bts button,.bts a{font:inherit;font-weight:600;min-height:44px;padding:8px 12px;border:1px solid var(--linea);border-radius:10px;background:var(--hoja);color:var(--tinta);cursor:pointer}
.mod button[aria-pressed=true]{background:var(--c);border-color:var(--c);color:#fff}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .mod button[aria-pressed=true]{color:#0b1220}}:root[data-theme=dark] .mod button[aria-pressed=true]{color:#0b1220}
.mod select{font:inherit;min-height:44px;padding:8px;border:1px solid var(--linea);border-radius:10px;background:var(--hoja);color:var(--tinta)}#marc{color:var(--suave);font-weight:600;margin-left:auto}
.caja{background:var(--hoja);border:1px solid var(--linea);border-radius:12px;padding:14px;margin:0 0 12px}.caja h2{margin:0 0 4px;font-size:1.1rem}.niv{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--cs);margin-bottom:6px}#ejTxt{margin:4px 0}#ejUsa{margin:6px 0 0;color:var(--suave);font-size:.92rem}
.bts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.bts .pri{background:var(--c);border-color:var(--c);color:#fff}@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .bts .pri{color:#0b1220}}:root[data-theme=dark] .bts .pri{color:#0b1220}
#cmds{display:flex;gap:5px;overflow-x:auto;padding:0 0 8px;scrollbar-width:thin}#cmds button{flex:none;font:600 .85rem ui-monospace,Consolas,monospace;min-height:38px;min-width:38px;padding:4px 8px;border:1px solid var(--linea);border-radius:8px;background:var(--cs);color:var(--tinta);cursor:pointer}
.ed{position:relative;display:flex;height:300px;background:#fff;border:1px solid #9fb3c8;border-radius:8px;overflow:hidden;font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#gut{flex:none;width:34px;margin:0;padding:8px 6px 8px 0;text-align:right;color:#7a8ba0;background:#eef2f6;overflow:hidden;user-select:none;font:inherit;white-space:pre}.edi{position:relative;flex:1;min-width:0}#hl,#cod{position:absolute;inset:0;margin:0;padding:8px;font:inherit;white-space:pre;overflow:auto;tab-size:4;border:0}#hl{color:#14202b;pointer-events:none}#cod{background:transparent;color:transparent;caret-color:#000;resize:none;outline:0;width:100%;height:100%;font-size:16px;line-height:22.5px;-webkit-text-fill-color:transparent;overflow-wrap:normal}#hl{font-size:16px;line-height:22.5px}#gut{font-size:16px;line-height:22.5px}#hl .k{color:#0b3fb3;font-weight:700}#hl .t{color:#7b1fa2}#hl .s{color:#0a7a2e}#hl .n{color:#b3541e}#hl .c{color:#6b7c8f;font-style:italic}.ed:focus-within{outline:2px solid var(--c);outline-offset:1px}
#consola{background:#0b1220;color:#e8eef8;border-radius:8px;padding:10px 12px;font:15px/1.45 ui-monospace,Consolas,monospace;min-height:90px;max-height:320px;overflow:auto;margin:10px 0;white-space:pre-wrap}#consola:empty::before{content:"La consola aparecerá aquí.";color:#7f8ea3}#consola .er{color:#ff9d9d}#consola .fi{color:#7fd1a0;margin-top:4px}#consola .ing{color:#9ecbff}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.ent{display:flex;gap:6px;align-items:center;margin:4px 0}.ent input{flex:1;min-width:0;font:inherit;font-size:16px;min-height:38px;padding:4px 8px;border-radius:6px;border:1px solid #4a5a70;background:#131c2e;color:#fff}.ent button{font:inherit;min-height:38px;padding:4px 10px;border-radius:6px;border:0;background:#2a3b55;color:#fff}
.pr{border:1px solid var(--linea);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--hoja)}.pr.bien{border-color:#15803d}.pr.mal{border-color:#b91c1c}.pr pre{white-space:pre-wrap;background:var(--cs);border-radius:6px;padding:6px 8px;margin:6px 0 0;font:.88rem ui-monospace,Consolas,monospace;max-height:160px;overflow:auto}#result h3{margin:10px 0 6px}
.sv{overflow:auto;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:4px;margin:10px 0;max-height:75vh}.sv:empty{display:none}.sv svg{display:block;max-width:none}#flujoEd{min-height:220px}
dialog{border:1px solid var(--linea);border-radius:14px;padding:16px;background:var(--hoja);color:var(--tinta);width:min(92vw,420px)}dialog::backdrop{background:rgb(0 0 0/.5)}dialog h3{margin:0 0 10px}.pal{display:grid;grid-template-columns:1fr 1fr;gap:8px}dialog button{font:inherit;font-weight:600;min-height:44px;padding:8px 12px;border:1px solid var(--linea);border-radius:10px;background:var(--cs);color:var(--tinta);cursor:pointer}dialog input{width:100%;font:16px ui-monospace,Consolas,monospace;min-height:44px;padding:8px 10px;border:1px solid var(--linea);border-radius:10px;background:var(--hoja);color:var(--tinta)}#txtAyu{color:var(--suave);font-size:.88rem;margin:6px 0}#txtErr{color:#b91c1c;font-size:.9rem;min-height:1.2em;margin:4px 0}.f{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}.f .p{background:var(--c);color:#fff;border-color:var(--c)}#solCod{white-space:pre;overflow-x:auto}

<div id="zonaFlu" hidden><p class="lead">Toca un <b>+</b> para añadir un bloque. Toca un bloque para cambiarlo o borrarlo.</p><div class="sv" id="flujoEd"></div>
<div class="bts"><button type="button" class="pri" id="btCheck2">Comprobar</button><button type="button" id="btRun2">▶ Ejecutar</button></div><details class="sol"><summary>Ver el pseudocódigo de mi diagrama</summary><pre class="code" id="codgen"></pre></details></div>

</div>
