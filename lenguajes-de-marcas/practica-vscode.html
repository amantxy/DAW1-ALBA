<script>
(function(){
const R=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const chk=(ok,msg)=>({ok:!!ok,msg});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parseH=c=>new DOMParser().parseFromString(c,'text/html');
const parseX=c=>{const d=new DOMParser().parseFromString(c.trim(),'application/xml');return {d,err:d.getElementsByTagName('parsererror').length>0}};
const NOMBRE={basico:'Básico',medio:'Medio',avanzado:'Avanzado'};
const RGB={red:'rgb(255, 0, 0)',navy:'rgb(0, 0, 128)',green:'rgb(0, 128, 0)',yellow:'rgb(255, 255, 0)',lightblue:'rgb(173, 216, 230)',pink:'rgb(255, 192, 203)',orange:'rgb(255, 165, 0)',gray:'rgb(128, 128, 128)'};
const SCAF='<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:8px"><h1 id="titulo">Título</h1><p>Párrafo normal</p><p class="destacado">Párrafo destacado</p><div id="caja" class="caja">Caja</div><ul><li>Uno</li><li>Dos</li></ul><a href="#" id="enlace">Enlace</a></body></html>';

/* ---------- Tema 2 · HTML ---------- */
const H={basico:[],medio:[],avanzado:[]};
H.basico.push(()=>{const t=R(['Mi página','Bienvenido','Sobre mí','Mis apuntes']);return{enun:`Crea un encabezado <h1> con el texto «${t}».`,hint:'Usa <h1> y su etiqueta de cierre </h1>.',sol:`<h1>${t}</h1>`,check:c=>{const hs=parseH(c).querySelectorAll('h1');return[chk(hs.length>=1,'Hay un <h1>'),chk(hs[0]&&hs[0].textContent.trim()===t,`El texto es «${t}»`)]}}});
H.basico.push(()=>{const n=R([3,4]);const items=shuffle(['Pan','Leche','Huevos','Café','Arroz']).slice(0,n);return{enun:`Crea una lista desordenada (<ul>) con ${n} elementos: ${items.join(', ')}.`,hint:'Cada elemento va en un <li>.',sol:`<ul>\n${items.map(i=>`  <li>${i}</li>`).join('\n')}\n</ul>`,check:c=>{const ul=parseH(c).querySelector('ul');const lis=ul?[...ul.querySelectorAll('li')].map(li=>li.textContent.trim()):[];return[chk(ul,'Hay una lista <ul>'),chk(lis.length===n,`Tiene ${n} elementos <li>`),chk(JSON.stringify(lis)===JSON.stringify(items),'Los elementos están en el orden pedido')]}}});
H.basico.push(()=>{const url=R(['https://www.example.com','https://www.wikipedia.org']);const txt=R(['Visítala','Más información']);return{enun:`Crea un enlace (<a>) a ${url} con el texto «${txt}».`,hint:'El destino va en el atributo href.',sol:`<a href="${url}">${txt}</a>`,check:c=>{const a=parseH(c).querySelector('a');return[chk(a,'Hay un enlace <a>'),chk(a&&a.getAttribute('href')===url,'El href es correcto'),chk(a&&a.textContent.trim()===txt,'El texto es correcto')]}}});
H.medio.push(()=>{const r=R([2,3]),cc=R([2,3]);const head=Array.from({length:cc},(_,i)=>`Col ${i+1}`);return{enun:`Crea una tabla con una fila de cabecera (<th>) de ${cc} columnas y ${r} filas de datos (<td>).`,hint:'La cabecera usa <th>, las filas de datos <td>, cada fila va en <tr>.',sol:`<table>\n  <tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>\n${Array.from({length:r},()=>`  <tr>${'<td>dato</td>'.repeat(cc)}</tr>`).join('\n')}\n</table>`,check:c=>{const t=parseH(c).querySelector('table');if(!t)return[chk(false,'Hay una tabla <table>')];const rows=[...t.querySelectorAll('tr')];const th=rows[0]?rows[0].querySelectorAll('th').length:0;return[chk(rows.length===r+1,`Tiene ${r+1} filas (1 de cabecera + ${r} de datos)`),chk(th===cc,`La cabecera tiene ${cc} celdas <th>`),chk(rows.slice(1).every(tr=>tr.querySelectorAll('td').length===cc),`Cada fila de datos tiene ${cc} celdas <td>`)]}}});
H.medio.push(()=>{const src=R(['foto.jpg','logo.png']),alt=R(['Logo','Foto de perfil']),w=R([200,300]);return{enun:`Inserta la imagen ${src} con el texto alternativo «${alt}» y un ancho de ${w} píxeles.`,hint:'Usa <img> con src, alt y width.',sol:`<img src="${src}" alt="${alt}" width="${w}">`,check:c=>{const im=parseH(c).querySelector('img');return[chk(im,'Hay una imagen <img>'),chk(im&&im.getAttribute('src')===src,'El src es correcto'),chk(im&&im.getAttribute('alt')===alt,'El alt es correcto'),chk(im&&im.getAttribute('width')===String(w),'El ancho es correcto')]}}});
H.medio.push(()=>({enun:'Crea un formulario con un campo de texto obligatorio llamado nombre y un botón de envío.',hint:'El campo necesita name="nombre" y el atributo required. El botón, type="submit".',sol:'<form>\n  <input type="text" name="nombre" required>\n  <button type="submit">Enviar</button>\n</form>',check:c=>{const d=parseH(c);return[chk(d.querySelector('form'),'Hay un <form>'),chk(d.querySelector('input[name="nombre"][required]'),'Campo nombre obligatorio'),chk(d.querySelector('button[type="submit"], input[type="submit"]'),'Botón de envío')]}}));
H.avanzado.push(()=>{const id=R(['intro','contacto','sobre']);return{enun:`Dentro de un <section id="${id}"> pon un <article> con un <h2> y un <p>.`,hint:'El <article> debe ser hijo directo de <section>.',sol:`<section id="${id}">\n  <article>\n    <h2>Título</h2>\n    <p>Texto</p>\n  </article>\n</section>`,check:c=>{const d=parseH(c);const s=d.querySelector('section#'+id);const a=s&&s.querySelector(':scope > article');return[chk(s,`Existe un section con id="${id}"`),chk(a,'El article es hijo directo de section'),chk(a&&a.querySelector('h2'),'Dentro del article hay un h2'),chk(a&&a.querySelector('p'),'Dentro del article hay un p')]}}});
H.avanzado.push(()=>{const c0=R([3,4]);return{enun:`Crea una tabla con una celda de cabecera (<th>) que ocupe ${c0} columnas (colspan) y, debajo, una fila con ${c0} celdas (<td>).`,hint:'colspan va en el <th> y su valor es el número de columnas.',sol:`<table>\n  <tr><th colspan="${c0}">Cabecera</th></tr>\n  <tr>${'<td>1</td>'.repeat(c0)}</tr>\n</table>`,check:c=>{const d=parseH(c);const th=d.querySelector(`th[colspan="${c0}"]`);const rows=[...d.querySelectorAll('table tr')];return[chk(th,`Hay un th con colspan="${c0}"`),chk(rows.length>=2&&rows[1].querySelectorAll('td').length===c0,`La fila tiene ${c0} celdas td`)]}}});
H.avanzado.push(()=>({enun:'Crea la estructura <header>, <main> y <footer>. Dentro de <main> pon un <nav> con dos enlaces a #inicio y #contacto.',hint:'Las etiquetas semánticas van directamente en el body; el <nav> va dentro del <main>.',sol:'<header>Cabecera</header>\n<main>\n  <nav>\n    <a href="#inicio">Inicio</a>\n    <a href="#contacto">Contacto</a>\n  </nav>\n</main>\n<footer>Pie</footer>',check:c=>{const d=parseH(c);const m=d.querySelector('main');const nav=m&&m.querySelector('nav');return[chk(d.querySelector('header'),'Hay un header'),chk(m,'Hay un main'),chk(nav,'El nav está dentro de main'),chk(nav&&nav.querySelectorAll('a[href^="#"]').length>=2,'Dos enlaces internos dentro del nav'),chk(d.querySelector('footer'),'Hay un footer')]}}));

/* ---------- Tema 3 · CSS (se comprueba aplicando el CSS a una página de prueba) ---------- */
function cssLab(code){return new Promise(res=>{const f=document.createElement('iframe');f.style.cssText='position:absolute;left:-10000px;top:0;width:700px;height:500px;border:0';f.onload=()=>res({d:f.contentDocument,w:f.contentWindow,done:()=>f.remove()});f.srcdoc=SCAF.replace('</head>','<style>'+code.replace(/<\/style/gi,'')+'</style></head>');document.body.appendChild(f)})}
const CS={basico:[],medio:[],avanzado:[]};
CS.basico.push(()=>{const c=R(['red','navy','green']);return{enun:`Pon el texto de todos los párrafos (<p>) en color ${c}.`,hint:'Selector p y la propiedad color.',sol:`p {\n  color: ${c};\n}`,check:async code=>{const lab=await cssLab(code);const ps=[...lab.d.querySelectorAll('p')];const r=[chk(ps.every(p=>lab.w.getComputedStyle(p).color===RGB[c]),`Todos los párrafos están en ${c}`)];lab.done();return r}}});
CS.basico.push(()=>{const c=R(['yellow','lightblue','pink']);return{enun:`Pon de fondo ${c} el título (<h1>).`,hint:'Usa background-color.',sol:`h1 {\n  background-color: ${c};\n}`,check:async code=>{const lab=await cssLab(code);const h=lab.d.querySelector('h1');const r=[chk(h&&lab.w.getComputedStyle(h).backgroundColor===RGB[c],`El fondo del h1 es ${c}`)];lab.done();return r}}});
CS.basico.push(()=>({enun:'Quita las viñetas de la lista (<ul>) con list-style: none.',hint:'La propiedad es list-style y el valor none.',sol:'ul {\n  list-style: none;\n}',check:async code=>{const lab=await cssLab(code);const ul=lab.d.querySelector('ul');const r=[chk(ul&&lab.w.getComputedStyle(ul).listStyleType==='none','La lista no tiene viñetas')];lab.done();return r}}));
CS.medio.push(()=>{const c=R(['red','navy','orange']);return{enun:`Crea la clase .destacado con texto en negrita (bold) y color ${c}.`,hint:'Recuerda el punto delante del nombre de la clase.',sol:`.destacado {\n  font-weight: bold;\n  color: ${c};\n}`,check:async code=>{const lab=await cssLab(code);const p=lab.d.querySelector('p.destacado');const cs=p&&lab.w.getComputedStyle(p);const r=[chk(cs&&parseInt(cs.fontWeight,10)>=600,'El texto va en negrita'),chk(cs&&cs.color===RGB[c],`El color es ${c}`)];lab.done();return r}}});
CS.medio.push(()=>{const w=R([2,4]),c=R(['navy','red','green']);return{enun:`Da al elemento #caja un borde sólido de ${w}px de color ${c}.`,hint:'Puedes usar la shorthand border: grosor estilo color.',sol:`#caja {\n  border: ${w}px solid ${c};\n}`,check:async code=>{const lab=await cssLab(code);const el=lab.d.getElementById('caja');const cs=el&&lab.w.getComputedStyle(el);const r=[chk(cs&&cs.borderTopStyle==='solid','El borde es sólido'),chk(cs&&cs.borderTopWidth===w+'px',`El grosor es ${w}px`),chk(cs&&cs.borderTopColor===RGB[c],`El color es ${c}`)];lab.done();return r}}});
CS.medio.push(()=>{const m=R([20,40]);return{enun:`Pon un margen de ${m}px a todos los lados del elemento #caja.`,hint:'La propiedad es margin.',sol:`#caja {\n  margin: ${m}px;\n}`,check:async code=>{const lab=await cssLab(code);const el=lab.d.getElementById('caja');const cs=el&&lab.w.getComputedStyle(el);const r=[chk(cs&&cs.marginTop===m+'px'&&cs.marginRight===m+'px'&&cs.marginBottom===m+'px'&&cs.marginLeft===m+'px',`Margen de ${m}px en los cuatro lados`)];lab.done();return r}}});
CS.avanzado.push(()=>{const w=R([300,400]);return{enun:`Centra horizontalmente #caja: ancho ${w}px y margin: 0 auto.`,hint:'auto en margin reparte el espacio sobrante a izquierda y derecha.',sol:`#caja {\n  width: ${w}px;\n  margin: 0 auto;\n}`,check:async code=>{const lab=await cssLab(code);const el=lab.d.getElementById('caja');const cs=el&&lab.w.getComputedStyle(el);const r=[chk(cs&&cs.width===w+'px',`El ancho es ${w}px`),chk(cs&&parseFloat(cs.marginLeft)>0&&cs.marginLeft===cs.marginRight,'Márgenes izquierdo y derecho iguales y positivos')];lab.done();return r}}});
CS.avanzado.push(()=>{const p=R([10,20]);return{enun:`En #caja pon box-sizing: border-box, width: 200px y padding: ${p}px. El ancho total debe seguir siendo 200px.`,hint:'Con border-box el padding entra dentro del ancho.',sol:`#caja {\n  box-sizing: border-box;\n  width: 200px;\n  padding: ${p}px;\n}`,check:async code=>{const lab=await cssLab(code);const el=lab.d.getElementById('caja');const cs=el&&lab.w.getComputedStyle(el);const r=[chk(cs&&cs.boxSizing==='border-box','box-sizing es border-box'),chk(el&&el.getBoundingClientRect().width===200,'El ancho total es 200px')];lab.done();return r}}});
CS.avanzado.push(()=>({enun:'Haz que los enlaces (<a>) cambien a color red al pasar el ratón (:hover).',hint:'Pseudo-clase :hover después del selector a.',sol:'a:hover {\n  color: red;\n}',check:async code=>[chk(/a\s*:hover\s*\{[^}]*color\s*:\s*red/i.test(code),'Hay una regla a:hover con color: red')]}));

/* ---------- Tema 1 · XML ---------- */
const X={basico:[],medio:[],avanzado:[]};
X.basico.push(()=>{const root=R(['biblioteca','agenda','tienda']),item=R(['libro','contacto','producto']),n=R([2,3]);return{enun:`Escribe un documento XML con la raíz <${root}> y ${n} elementos <${item}> dentro.`,hint:'Solo puede haber una raíz, y todas las etiquetas se cierran.',sol:`<${root}>\n${Array.from({length:n},()=>`  <${item}></${item}>`).join('\n')}\n</${root}>`,check:c=>{const r=parseX(c);if(r.err)return[chk(false,'El XML está bien formado')];const rt=r.d.documentElement;return[chk(true,'Está bien formado'),chk(rt.tagName===root,`La raíz es <${root}>`),chk(rt.getElementsByTagName(item).length===n,`Hay ${n} elementos <${item}>`)]}}});
X.basico.push(()=>({enun:'Escribe un XML que empiece por la declaración <?xml version="1.0" encoding="UTF-8"?> y tenga como raíz <libro></libro>.',hint:'La declaración va en la primera línea, sin nada antes.',sol:'<?xml version="1.0" encoding="UTF-8"?>\n<libro></libro>',check:c=>{const r=parseX(c);return[chk(/^<\?xml\s+version="1\.0"\s+encoding="UTF-8"\s*\?>/.test(c.trim()),'La declaración está al principio y es correcta'),chk(!r.err,'Está bien formado'),chk(r.d.documentElement&&r.d.documentElement.tagName==='libro','La raíz es <libro>')]}}));

    <div class="fila"><button data-test-nuevo>Nuevas preguntas</button><button class="p" data-test-ok>Corregir</button></div>

  </div></details>
  <details class="fold flash"><summary><span><b>Flashcards</b><small>Repasa los conceptos del tema</small></span></summary><div class="in">

  const girar=()=>{const c=deck[idx];vuelta=!vuelta;const f=card.querySelector('.fr');f.textContent=vuelta?c[1]:c[0];f.classList.toggle('atras',vuelta)};

  el.querySelector('[data-next]').onclick=()=>{idx=(idx+1)%deck.length;pinta()};

function nuevo(t){
  const lvl=document.querySelector(`#p-${t} [data-lvl]`).value;
  const pool=GEN[t][lvl];
  const ex=R(pool)();
  state[t]=ex;
  const el=document.getElementById('p-'+t);
  el.querySelector('[data-enun]').textContent=`[${NOMBRE[lvl]}] ${ex.enun}`;
  el.querySelector('[data-ed]').value='';
  el.querySelector('[data-res]').innerHTML='';
  el.querySelector('[data-solbox]').hidden=true;
  el.querySelector('[data-pistatxt]').textContent='';
  const f=el.querySelector('[data-prevfr]');if(f)f.hidden=true;
  return ex;
}
async function comprobar(t){
  const ex=state[t];
  const el=document.getElementById('p-'+t);
  const ul=el.querySelector('[data-res]');
  if(!ex){ul.innerHTML='<li>Primero pulsa «Nuevo ejercicio».</li>';return}
  const code=el.querySelector('[data-ed]').value;
  const r=await ex.check(code);
  const ok=r.every(x=>x.ok);
  ul.innerHTML=r.map(x=>`<li class="${x.ok?'bien':'mal'}">${x.ok?'✔':'✘'} ${x.msg}</li>`).join('')+`<li class="${ok?'bien':'mal'}"><b>${ok?'¡Correcto! Todo el ejercicio está bien.':'Aún no está completo. Revisa los puntos marcados.'}</b></li>`;
}
function test(t){
  const el=document.getElementById('p-'+t);
  const preg=shuffle(TEST[t]).slice(0,5).map(p=>{const ops=p.o.map((o,i)=>({o,i}));return{...p,ops:shuffle(ops)}});
  state['test'+t]=preg;
  el.querySelector('[data-test]').innerHTML=preg.map((p,k)=>`<fieldset class="preg"><legend>${k+1}. ${esc(p.q)}</legend>${p.ops.map((x,j)=>`<label><input type="radio" name="q${t}${k}" value="${x.i}"> ${esc(x.o)}</label>`).join('')}</fieldset>`).join('');
  el.querySelector('[data-test-res]').textContent='';
}
function corregirTest(t){
  const el=document.getElementById('p-'+t);
  const preg=state['test'+t]||[];
  let n=0;const notas=[];
  preg.forEach((p,k)=>{const sel=el.querySelector(`input[name="q${t}${k}"]:checked`);const ok=sel&&Number(sel.value)===p.a;if(ok)n++;notas.push((ok?'✔ ':'✘ ')+esc(p.q)+' — '+esc(p.e))});
  el.querySelector('[data-test-res]').innerHTML=`<b>${n} de ${preg.length} correctas.</b><br>`+notas.join('<br>');
}
