<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heladería La Nube</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header>
    <img src="img/logo.svg" width="64" height="64" alt="Logo de La Nube">
    <h1>Heladería La Nube</h1>
    <nav>
      <a href="#sabores">Sabores</a>
      <a href="#contacto">Dónde estamos</a>
    </nav>
  </header>

  <main id="sabores">
    <img src="img/sello.svg" width="64" height="64" alt="Sello de La Nube">
    <h2>Nuestros sabores</h2>
    <ul>
      <li>Vainilla</li>
      <li>Chocolate negro</li>
      <li>Fresa con nata</li>
      <li><span class="nuevo">Pistacho salado</span></li>
    </ul>
    <div class="precio">Una bola: <span class="importe">2,50 €</span></div>
    <div class="precio">Dos bolas: <span class="importe">3,80 €</span></div>
  </main>

  <footer id="contacto">
    <p>Calle de los Barquillos, 7</p>
    <p class="horario">Abrimos todos los días de 12:00 a 22:00.</p>
    <p><a href="https://example.com/mapa">Ver en el mapa</a></p>
  </footer>
</body>
</html>
