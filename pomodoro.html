<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pomodoro · Estudio</title><style>
:root{--bg:#f3f6fb;--hoja:#fff;--tinta:#0f1b2d;--suave:#52637a;--linea:#d7e0ec;--c:#ea580c;--cs:color-mix(in srgb,var(--c) 12%,var(--hoja));--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--hoja:#131c2e;--tinta:#e8eef8;--suave:#9aabc4;--linea:#25324a;--c:#ff9a55;--cs:color-mix(in srgb,var(--c) 16%,var(--hoja));--ok:#4ade80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinta);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
.hero{background:var(--c);color:#fff;padding:28px 0 26px;margin-bottom:24px}
@media (prefers-color-scheme:dark){.hero{color:#0b1220}}
.hero .wrap{padding-bottom:0}
.hero h1{margin:0;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.15}
.hero p{margin:6px 0 0;opacity:.92}
.back{display:inline-block;color:inherit;text-decoration:none;font-weight:600;font-size:.92rem;padding:8px 0;margin-bottom:6px}
.back:hover{text-decoration:underline}
.panel{background:var(--hoja);border:1px solid var(--linea);border-radius:16px;padding:22px 18px;text-align:center}
.fase{display:inline-block;font-weight:700;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:var(--cs);color:var(--c)}
.fase.descanso{background:color-mix(in srgb,var(--ok) 16%,var(--hoja));color:var(--ok)}
.reloj{font:700 clamp(3.6rem,18vw,6.5rem)/1 ui-monospace,Consolas,monospace;margin:14px 0 8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.barra{height:10px;background:var(--linea);border-radius:999px;overflow:hidden;margin:6px 0 18px}
.barra i{display:block;height:100%;width:0;background:var(--c);transition:width .9s linear}
.fase.descanso ~ .barra i{background:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
button{font:inherit;font-weight:600;border:1px solid var(--linea);background:var(--hoja);color:var(--tinta);border-radius:12px;padding:12px 18px;min-height:48px;min-width:110px;cursor:pointer}
button:hover{border-color:var(--c)}
button.pri{background:var(--c);border-color:var(--c);color:#fff}
@media (prefers-color-scheme:dark){button.pri{color:#0b1220}}
button:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.card{background:var(--hoja);border:1px solid var(--linea);border-radius:14px;padding:16px 18px;margin-top:16px}
.card h2{margin:0 0 10px;font-size:1.05rem}
.ajustes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
label{display:block;font-size:.88rem;color:var(--suave);text-align:left}
input[type=number],input[type=text]{width:100%;margin-top:4px;font:inherit;padding:10px 12px;border:1px solid var(--linea);border-radius:10px;background:var(--bg);color:var(--tinta);min-height:44px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stats div{flex:1;min-width:120px;background:var(--cs);border-radius:12px;padding:12px;text-align:center}
.stats b{display:block;font-size:1.6rem;color:var(--c)}
.stats span{font-size:.85rem;color:var(--suave)}
.ayuda{color:var(--suave);font-size:.9rem;margin-top:12px}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.95rem;color:var(--tinta)}
.chk input{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style><link rel="stylesheet" href="fondo.css"><script src="tema.js"></script><script src="acceso.js"></script></head><body>
<div class="hero"><div class="wrap"><a class="back" href="index.html">← Volver</a><h1>Pomodoro de estudio</h1><p>25 minutos de foco, 5 de descanso. Sin prisas.</p></div></div>
<div class="wrap">
  <div class="panel" id="panel" aria-live="polite">
    <span class="fase" id="fase">Foco</span>
    <div class="reloj" id="reloj" role="timer">25:00</div>
    <div class="barra" aria-hidden="true"><i id="progreso"></i></div>
    <div class="btns">
      <button class="pri" id="btnIni" type="button">Empezar</button>
      <button id="btnPausa" type="button" disabled>Pausa</button>
      <button id="btnReset" type="button">Reiniciar</button>
      <button id="btnSaltar" type="button" title="Pasa a la siguiente fase">Saltar fase</button>
    </div>
    <label class="chk"><input type="checkbox" id="sonido" checked> Avisar con sonido al terminar</label>
  </div>

  <div class="card">
    <h2>Mi sesión</h2>
    <label for="tarea">¿Qué estudias ahora?</label>
    <input type="text" id="tarea" maxlength="80" placeholder="Ej.: HTML · formularios">
    <div class="stats" style="margin-top:14px">
      <div><b id="hoyPom">0</b><span>pomodoros hoy</span></div>
      <div><b id="hoyMin">0</b><span>minutos de foco hoy</span></div>
      <div><b id="ciclo">0/4</b><span>ciclo actual</span></div>
    </div>
    <p class="ayuda">Tras 4 pomodoros tienes un descanso largo. Tus contadores se guardan en este navegador.</p>
  </div>

  <details class="card">
    <summary style="cursor:pointer;font-weight:700">Ajustar duraciones</summary>
    <div class="ajustes" style="margin-top:12px">
      <div><label for="dFoco">Foco (min)</label><input type="number" id="dFoco" min="1" max="120" value="25"></div>
      <div><label for="dCorto">Descanso corto</label><input type="number" id="dCorto" min="1" max="60" value="5"></div>
      <div><label for="dLargo">Descanso largo</label><input type="number" id="dLargo" min="1" max="60" value="15"></div>
    </div>
  </details>
</div>

<script>
(function(){
  var K="pomodoro:v1";
  var cfg={foco:25,corto:5,largo:15};
  var fases={foco:"Foco",corto:"Descanso",largo:"Descanso largo"};
  var estado={fase:"foco",restante:25*60,total:25*60,corriendo:false,ciclo:0,fin:0};
  var hoy=new Date().toDateString();
  var reg={dia:hoy,pom:0,min:0};
  var $=function(id){return document.getElementById(id)};
  var timer=null;

  function leer(){try{var r=JSON.parse(localStorage.getItem(K)||"null");if(r){if(r.reg&&r.reg.dia===hoy)reg=r.reg;if(r.cfg)cfg=r.cfg;}}catch(e){}}
  function guardar(){try{localStorage.setItem(K,JSON.stringify({reg:reg,cfg:cfg}))}catch(e){}}
  function mmss(s){s=Math.max(0,Math.round(s));var m=Math.floor(s/60),r=s%60;return (m<10?"0":"")+m+":"+(r<10?"0":"")+r}
  function duracion(f){return (f==="foco"?cfg.foco:f==="corto"?cfg.corto:cfg.largo)*60}

  function pinta(){
    $("reloj").textContent=mmss(estado.restante);
    document.title=(estado.corriendo?mmss(estado.restante)+" · ":"")+(estado.fase==="foco"?"Foco":"Descanso")+" · Pomodoro";
    var f=$("fase");f.textContent=fases[estado.fase];
    f.className="fase"+(estado.fase==="foco"?"":" descanso");
    $("progreso").style.width=(100*(1-estado.restante/estado.total))+"%";
    $("btnIni").textContent=estado.corriendo?"Corriendo…":(estado.restante<estado.total?"Continuar":"Empezar");
    $("btnIni").disabled=estado.corriendo;
    $("btnPausa").disabled=!estado.corriendo;
    $("ciclo").textContent=estado.ciclo%4+"/4";
    $("hoyPom").textContent=reg.pom;
    $("hoyMin").textContent=reg.min;
  }

  function tic(){
    var ahora=Date.now();
    var resta=Math.round((estado.fin-ahora)/1000);
    estado.restante=Math.max(0,resta);
    if(estado.restante<=0){terminaFase();return}
    pinta();
  }

  function sonar(){
    if(!$("sonido").checked)return;
    try{
      var A=window.AudioContext||window.webkitAudioContext,c=new A();
      [0,.35,.7].forEach(function(t){var o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start(c.currentTime+t);o.stop(c.currentTime+t+.22)});
    }catch(e){}
    try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
  }

  function terminaFase(){
    sonar();
    if(estado.fase==="foco"){
      reg.pom++;reg.min+=cfg.foco;estado.ciclo++;guardar();
      siguiente(estado.ciclo%4===0?"largo":"corto");
    }else{
      siguiente("foco");
    }
  }

  function siguiente(f){
    clearInterval(timer);timer=null;
    estado.fase=f;estado.total=duracion(f);estado.restante=estado.total;estado.corriendo=false;
    pinta();
  }

  function arranca(){
    if(estado.corriendo)return;
    estado.corriendo=true;
    estado.fin=Date.now()+estado.restante*1000;
    timer=setInterval(tic,250);
    pinta();
  }
  function pausa(){
    if(!estado.corriendo)return;
    estado.corriendo=false;clearInterval(timer);timer=null;
    estado.restante=Math.max(0,Math.round((estado.fin-Date.now())/1000));
    pinta();
  }
  function reinicia(){
    clearInterval(timer);timer=null;
    estado.corriendo=false;estado.total=duracion(estado.fase);estado.restante=estado.total;
    pinta();
  }

  function aplicaCfg(){
    function v(id,d,mx){var n=parseInt($(id).value,10);if(!(n>0))n=d;return Math.min(mx,n)}
    cfg.foco=v("dFoco",25,120);cfg.corto=v("dCorto",5,60);cfg.largo=v("dLargo",15,60);
    guardar();
    if(!estado.corriendo)reinicia();
  }

  $("btnIni").onclick=arranca;
  $("btnPausa").onclick=pausa;
  $("btnReset").onclick=reinicia;
  $("btnSaltar").onclick=function(){
    if(estado.fase==="foco"){siguiente(estado.ciclo%4===3?"largo":"corto")}else{siguiente("foco")}
  };
  ["dFoco","dCorto","dLargo"].forEach(function(id){$(id).onchange=aplicaCfg});
  $("sonido").onchange=function(){};

  try{var t=localStorage.getItem(K+":tarea");if(t)$("tarea").value=t}catch(e){}
  $("tarea").oninput=function(){try{localStorage.setItem(K+":tarea",this.value)}catch(e){}};

  leer();
  $("dFoco").value=cfg.foco;$("dCorto").value=cfg.corto;$("dLargo").value=cfg.largo;
  estado.total=duracion("foco");estado.restante=estado.total;
  pinta();
  document.addEventListener("visibilitychange",function(){if(estado.corriendo)tic()});
})();
</script>
</body></html>
