<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDE de Java</title><style>
:root{--bg:#f3f6fb;--hoja:#fff;--tinta:#0f1b2d;--suave:#52637a;--linea:#d7e0ec;--c:#2563eb;--cs:color-mix(in srgb,var(--c) 12%,var(--hoja));--ed:#fff;--gut:#eef2f6;--gt:#7a8ba0;--tx:#14202b;--k:#0b3fb3;--ty:#7b1fa2;--st:#0a7a2e;--nu:#b3541e;--co:#6b7c8f;--mer:rgb(220 38 38/.13);--mav:rgb(217 119 6/.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--hoja:#131c2e;--tinta:#e8eef8;--suave:#9aabc4;--linea:#25324a;--c:#6ea8ff;--ed:#0f1726;--gut:#131c2e;--gt:#6f819b;--tx:#e6edf7;--k:#8ab4ff;--ty:#d6a4ff;--st:#7fdc9c;--nu:#ffb27a;--co:#7f8ea3;--mer:rgb(248 113 113/.2);--mav:rgb(251 191 36/.16);color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b1220;--hoja:#131c2e;--tinta:#e8eef8;--suave:#9aabc4;--linea:#25324a;--c:#6ea8ff;--ed:#0f1726;--gut:#131c2e;--gt:#6f819b;--tx:#e6edf7;--k:#8ab4ff;--ty:#d6a4ff;--st:#7fdc9c;--nu:#ffb27a;--co:#7f8ea3;--mer:rgb(248 113 113/.2);--mav:rgb(251 191 36/.16);color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--tinta);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100dvh}
.hero{background:var(--c);color:#fff;padding:6px 0!important;margin:0!important}.hero .wrap{display:flex;align-items:baseline;gap:12px;padding:0 12px}.hero h1{margin:0;font-size:1.15rem!important}.back{color:inherit;text-decoration:none;font-weight:600;font-size:.9rem;padding:6px 0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .hero{color:#0b1220}}:root[data-theme=dark] .hero{color:#0b1220}
.herr{display:flex;gap:6px;padding:6px 8px;background:var(--hoja);border-bottom:1px solid var(--linea);overflow-x:auto;align-items:center;flex:none}.herr button,.herr select{flex:none;font:600 .85rem/1.1 system-ui,sans-serif;min-height:40px;padding:6px 10px;border:1px solid var(--linea);border-radius:8px;background:var(--hoja);color:var(--tinta);cursor:pointer}.herr button:disabled{opacity:.45;cursor:default}.herr .run{background:#15803d;border-color:#15803d;color:#fff}.herr .sp{flex:none;width:1px;align-self:stretch;background:var(--linea);margin:0 2px}#pos{margin-left:auto;flex:none;color:var(--suave);font-size:.82rem;white-space:nowrap}
main{flex:1 1 auto;display:grid;grid-template-columns:190px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 230px;grid-template-areas:"tree edit" "tree out";min-height:0}
#proy{grid-area:tree;background:var(--hoja);border-right:1px solid var(--linea);padding:8px;overflow:auto;display:flex;flex-direction:column;gap:6px}#proy h2{margin:0;font-size:.82rem;color:var(--suave)}#arbol{display:flex;flex-direction:column;gap:2px}.ar button{display:block;width:100%;text-align:left;font:500 .88rem/1.2 ui-monospace,Menlo,Consolas,monospace;padding:7px 8px;min-height:36px;background:none;border:0;border-radius:6px;color:var(--tinta);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ar.on button{background:var(--cs);font-weight:700}.acc{display:flex;flex-wrap:wrap;gap:4px}.acc button{font:600 .8rem system-ui,sans-serif;min-height:34px;padding:4px 8px;border:1px solid var(--linea);border-radius:7px;background:var(--hoja);color:var(--tinta);cursor:pointer}.acc button:disabled{opacity:.45}
#edit{grid-area:edit;display:flex;flex-direction:column;min-height:0;min-width:0}#tit{padding:4px 10px;font:600 .85rem ui-monospace,Menlo,Consolas,monospace;background:var(--hoja);border-bottom:1px solid var(--linea);display:none}
#cmds{display:none;gap:4px;overflow-x:auto;padding:4px 6px;background:var(--hoja);border-bottom:1px solid var(--linea);flex:none}#cmds button{flex:none;font:600 .85rem ui-monospace,Consolas,monospace;min-height:36px;min-width:36px;padding:3px 8px;border:1px solid var(--linea);border-radius:7px;background:var(--cs);color:var(--tinta)}
.ed{position:relative;display:flex;flex:1 1 auto;min-height:0;background:var(--ed);font:14px/21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}#gut{flex:none;width:44px;margin:0;padding:8px 8px 8px 0;text-align:right;color:var(--gt);background:var(--gut);overflow:hidden;user-select:none;font:inherit;white-space:pre}#gut b{color:#fff;background:#dc2626;border-radius:3px;padding:0 3px;font-weight:600}#gut b.gav{background:#d97706}.edi{position:relative;flex:1;min-width:0}#hl,#cod{position:absolute;inset:0;margin:0;padding:8px;font:inherit;white-space:pre;overflow:auto;tab-size:4;border:0}#hl{color:var(--tx);pointer-events:none}#hl i{font-style:normal}#hl .k{color:var(--k);font-weight:700}#hl .t{color:var(--ty)}#hl .s{color:var(--st)}#hl .n{color:var(--nu)}#hl .c{color:var(--co);font-style:italic}#hl .a{color:var(--nu)}#hl .mer{background:var(--mer);text-decoration:underline wavy #dc2626 1px;text-underline-offset:3px}#hl .mav{background:var(--mav)}#cod{background:transparent;color:transparent;caret-color:var(--tx);resize:none;outline:0;width:100%;height:100%;-webkit-text-fill-color:transparent;overflow-wrap:normal}#cod::selection{background:rgb(37 99 235/.28)}
#sal{grid-area:out;display:flex;flex-direction:column;min-height:0;background:var(--hoja);border-top:1px solid var(--linea)}.tabs{display:flex;align-items:center;gap:2px;padding:0 6px;border-bottom:1px solid var(--linea);flex:none}.tabs button{font:600 .85rem system-ui,sans-serif;min-height:36px;padding:4px 12px;border:0;background:none;color:var(--suave);cursor:pointer;border-bottom:2px solid transparent}.tabs button[aria-selected=true]{color:var(--tinta);border-color:var(--c)}.tabs .hayerr{color:#dc2626}#cBar{margin-left:auto}#cBar button{font-weight:500}
#consola{flex:1;margin:0;overflow:auto;background:#0b1220;color:#e8eef8;padding:8px 10px;font:13.5px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}#consola .er{color:#ff9d9d}#consola .fi{color:#7fd1a0}#consola .ec{color:#9ecbff}.ent{display:flex;gap:6px;align-items:center;margin:4px 0}.ent input{flex:1;min-width:0;font:inherit;font-size:16px;min-height:36px;padding:3px 8px;border-radius:6px;border:1px solid #4a5a70;background:#131c2e;color:#fff}.ent button{font:inherit;min-height:36px;padding:3px 10px;border-radius:6px;border:0;background:#2a3b55;color:#fff}
#problemas{flex:1;overflow:auto;padding:4px}#problemas p{margin:8px;color:var(--suave)}.pr{display:block;width:100%;text-align:left;font:inherit;font-size:.88rem;padding:7px 8px;min-height:36px;background:none;border:0;border-bottom:1px solid var(--linea);color:var(--tinta);cursor:pointer}.pr b{color:#dc2626}.pr.av b{color:#b45309}
#pop{position:fixed;z-index:30;min-width:190px;max-width:320px;background:var(--hoja);border:1px solid var(--linea);border-radius:8px;box-shadow:0 8px 24px rgb(0 0 0/.22);padding:3px}#pop[hidden]{display:none}#pop button{display:block;width:100%;text-align:left;font:13px ui-monospace,Consolas,monospace;padding:6px 8px;border:0;border-radius:5px;background:none;color:var(--tinta);cursor:pointer}#pop button.on{background:var(--cs)}#pop small{color:var(--suave);font-family:system-ui}
dialog{border:1px solid var(--linea);border-radius:14px;padding:16px;background:var(--hoja);color:var(--tinta);width:min(92vw,380px)}dialog::backdrop{background:rgb(0 0 0/.5)}dialog h2{margin:0 0 8px;font-size:1.1rem}dialog input{width:100%;font:16px ui-monospace,Consolas,monospace;min-height:44px;padding:8px 10px;border:1px solid var(--linea);border-radius:10px;background:var(--hoja);color:var(--tinta)}#nomErr{color:#b91c1c;min-height:1.2em;margin:6px 0 0;font-size:.88rem}.f{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.f button{font:inherit;font-weight:600;min-height:44px;padding:8px 14px;border:1px solid var(--linea);border-radius:10px;background:var(--hoja);color:var(--tinta);cursor:pointer}.f .p{background:var(--c);border-color:var(--c);color:#fff}
details.ay{font-size:.8rem;color:var(--suave);margin-top:auto}details.ay summary{cursor:pointer;font-weight:600;min-height:28px}details.ay ul{margin:4px 0;padding-left:16px}details.ay kbd{font:600 .72rem ui-monospace,Consolas,monospace;background:var(--cs);border-radius:4px;padding:0 3px}
@media (max-width:760px){main{display:flex;flex-direction:column;flex:none}body{min-height:100dvh}#proy{border-right:0;border-bottom:1px solid var(--linea);flex-direction:row;flex-wrap:wrap;align-items:center;padding:6px 8px;overflow:visible}#proy h2,details.ay{display:none}#arbol{flex-direction:row;overflow-x:auto;flex:1 1 100%}.ar button{width:auto;min-height:38px}#edit{height:62dvh;min-height:340px}#cmds{display:flex}.ed{font-size:16px;line-height:23px}#gut{width:38px}#hl,#cod{padding:6px}#sal{height:42dvh;min-height:240px}#consola{font-size:14px}}
</style><link rel="stylesheet" href="../fondo.css"><script src="../tema.js"></script><style>body{background-image:none!important}body .hero{padding:4px 0!important;margin:0!important}body .hero h1{font-size:1.15rem!important}</style></head><body>
<div class="hero"><div class="wrap"><a class="back" href="index.html">← Volver</a><h1>IDE de Java</h1></div></div>
<div class="herr"><button type="button" class="run" id="btRun">▶ Ejecutar</button><button type="button" id="btPar" disabled>■ Parar</button><span class="sp"></span><button type="button" id="btFmt">Formatear</button><label for="ejem" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)">Ejemplos</label><select id="ejem"></select><span class="sp"></span><button type="button" id="btDes">Descargar .java</button><button type="button" id="btAbr">Abrir .java</button><input type="file" id="arch" accept=".java" hidden><span id="pos"></span></div>
<main>
<aside id="proy"><h2>Proyecto</h2><div id="arbol"></div><div class="acc"><button type="button" id="btNue">Nueva clase</button><button type="button" id="btRen">Renombrar</button><button type="button" id="btBor">Borrar</button><button type="button" id="btRei">Empezar de cero</button></div>
<details class="ay"><summary>Atajos</summary><ul><li><kbd>F6</kbd> ejecutar</li><li><kbd>sout</kbd> + <kbd>Tab</kbd> println</li><li><kbd>psvm</kbd> + <kbd>Tab</kbd> main</li><li><kbd>fori</kbd> + <kbd>Tab</kbd> for</li><li><kbd>Ctrl</kbd> + <kbd>Espacio</kbd> sugerencias</li><li><kbd>Ctrl</kbd> + <kbd>/</kbd> comentar</li><li><kbd>Alt</kbd> + <kbd>Mayús</kbd> + <kbd>F</kbd> formatear</li></ul></details></aside>
<section id="edit"><div id="cmds" aria-label="Símbolos"><button type="button">sout</button><button type="button">{</button><button type="button">}</button><button type="button">(</button><button type="button">)</button><button type="button">;</button><button type="button">"</button><button type="button">=</button><button type="button">+</button><button type="button">[</button><button type="button">]</button><button type="button">&lt;</button><button type="button">&gt;</button><button type="button">.</button><button type="button">,</button><button type="button">!</button><button type="button">&amp;&amp;</button><button type="button" data-t="||">||</button><button type="button">'</button><button type="button" data-t="    ">Tab</button></div>
<div class="ed"><pre id="gut" aria-hidden="true"></pre><div class="edi"><pre id="hl" aria-hidden="true"></pre><textarea id="cod" aria-label="Código Java" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div></div></section>
<section id="sal"><div class="tabs" role="tablist"><button type="button" role="tab" id="tabS">Salida</button><button type="button" role="tab" id="tabP">Problemas</button><span id="cBar"><button type="button" id="btLim">Limpiar</button></span></div><div id="consola" aria-live="polite"></div><div id="problemas" hidden></div></section>
</main>
<div id="pop" hidden></div>
<dialog id="dlgNom"><form id="nomFrm"><h2 id="nomTit"></h2><input id="nomVal" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Nombre de la clase"><p id="nomErr" role="alert"></p><div class="f"><button type="button" id="nomCan">Cancelar</button><button class="p">Aceptar</button></div></form></dialog>
<script src="java.js"></script><script src="ide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script><script src="../supabase-config.js"></script><script src="../progreso.js" data-pagina="ide-java" data-claves="ide:*"></script>
</body></html>
