dialog .row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
#pe{color:#c0392b;min-height:1.2em;font-size:.9rem}

<script>
const SJ=[{"slug": "programacion", "name": "Programación", "c": "#2563eb", "cd": "#6ea8ff"}, {"slug": "lenguajes-de-marcas", "name": "Lenguaje de Marcas", "c": "#ea580c", "cd": "#ff9a55"}, {"slug": "bases-de-datos", "name": "Bases de Datos", "c": "#059669", "cd": "#34d399"}, {"slug": "sistemas-informaticos", "name": "Sistemas Informáticos", "c": "#7c3aed", "cd": "#b794ff"}, {"slug": "transformacion", "name": "Transformación del Sistema Productivo", "c": "#db2777", "cd": "#ff7ab8"}, {"slug": "entornos-de-desarrollo", "name": "Entornos de Desarrollo", "c": "#0891b2", "cd": "#4fd1e8"}, {"slug": "ingles-profesional", "name": "Inglés Profesional", "c": "#ca8a04", "cd": "#f5c542"}];
const $=s=>document.querySelector(s);
const dark=matchMedia("(prefers-color-scheme: dark)").matches;
const BUCKET="documentos",MAXMB=50;

const TAG={pdf:"PDF",img:"IMG",docx:"DOC",md:"MD",txt:"TXT",html:"HTML",video:"VÍDEO"};
const q=new URLSearchParams(location.search);
let cur=q.get("s")||"",sb=null,user=null,docs=[],urls=[],turno=0,listo=false;
const msg=t=>{$("#msg").textContent=t};
const sj=slug=>SJ.find(s=>s.slug===slug)||SJ[0];
function color(slug){if(slug)document.documentElement.style.setProperty("--c",dark?sj(slug).cd:sj(slug).c)}
const extDe=n=>(n.match(/\.([^.]+)$/)||[,""])[1].toLowerCase();
/* ---- documentos antiguos guardados en este navegador ---- */
function dbLocal(){return new Promise(ok=>{try{const r=indexedDB.open("daw1-docs",1);r.onupgradeneeded=()=>r.result.createObjectStore("d",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(null)}catch(e){ok(null)}})}
async function leerLocal(){const db=await dbLocal();if(!db)return[];return new Promise(ok=>{const r=db.transaction("d").objectStore("d").getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ok([])})}
async function borrarLocal(id){const db=await dbLocal();if(!db)return;return new Promise(ok=>{const t=db.transaction("d","readwrite");t.objectStore("d").delete(id);t.oncomplete=ok;t.onerror=ok})}
function aArchivo(d){if(d.blob)return new File([d.blob],d.name||d.title||"documento");return new File([d.html||""],(d.title||"documento")+".html",{type:"text/html"})}
/* ---- nube ---- */
function textoError(e){const t=String(e&&e.message||e||"");if(/invalid login/i.test(t))return"Correo o contraseña incorrectos.";if(/failed to fetch|networkerror|load failed/i.test(t))return"No se pudo conectar con Supabase. Comprueba la conexión o si el proyecto está en pausa.";if(/maximum allowed size|too large/i.test(t))return"El archivo supera el límite de "+MAXMB+" MB.";if(/row-level security|jwt/i.test(t))return"Tu sesión no tiene permiso. Sal y vuelve a entrar.";return t||"Error desconocido."}
async function cargar(){const r=await sb.from("documentos").select("*");if(r.error)throw r.error;docs=r.data||[]}
async function subir(file,asignatura,unidad,creado){
 const ext=extDe(file.name),t=TIPOS[ext];
 if(!t)throw new Error("formato no admitido");
 if(file.size>MAXMB*1048576)throw new Error("supera el límite de "+MAXMB+" MB");
 const id=crypto.randomUUID(),ruta=user.id+"/"+id+"."+ext;
 const up=await sb.storage.from(BUCKET).upload(ruta,file,{contentType:t[1],upsert:false});
 if(up.error)throw up.error;
 const fila={id,asignatura,unidad,titulo:file.name.replace(/\.[^.]+$/,""),nombre:file.name,tipo:t[0],ruta,tamano:file.size};
 if(creado)fila.creado=creado;
 const ins=await sb.from("documentos").insert(fila);
 if(ins.error){await sb.storage.from(BUCKET).remove([ruta]);throw ins.error}}
const clave=(s,n,ts)=>s+"|"+n+"|"+new Date(ts).getTime();
/* Sube documentos antiguos sin repetir los que ya estén en la nube. Devuelve los que se pudieron guardar. */
async function moverAntiguos(L,alAcabar){
 await cargar();const ya=new Set(docs.map(d=>clave(d.asignatura,d.nombre,d.creado)));let n=0;const mal=[];
 for(const[i,d]of L.entries()){msg("Subiendo "+(i+1)+" de "+L.length+"…");
  try{const f=aArchivo(d),s=sj(d.s).slug,ts=d.ts||Date.now();
   if(!ya.has(clave(s,f.name,ts)))await subir(f,s,d.u||"Sin unidad",new Date(ts).toISOString());
   if(alAcabar)await alAcabar(d);n++}
  catch(e){mal.push((d.title||d.name||"documento")+": "+textoError(e))}}
 return{n,mal}}
/* ---- lectura ---- */
function limpio(h){return DOMPurify.sanitize(h,{FORBID_TAGS:["style","form","input","button","textarea","select"],FORBID_ATTR:["style"]})}
async function showPdf(box,blob,vivo){
 if(typeof pdfjsLib==="undefined")throw new Error("no se pudo cargar el visor de PDF");
 pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
 const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
 const w=Math.max(280,box.clientWidth-8)*Math.min(devicePixelRatio||1,2);
 for(let i=1;i<=pdf.numPages&&vivo();i++){const pg=await pdf.getPage(i);const v0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:w/v0.width});
  const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;box.append(c);await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise}}
async function mostrar(box,d,blob,vivo){
 if(d.tipo==="pdf")return showPdf(box,blob,vivo);
 if(d.tipo==="img"){const i=new Image();i.alt=d.titulo;i.src=enlace(new Blob([blob],{type:TIPOS[extDe(d.ruta)][1]}));box.append(i);return}
 let h;
 if(d.tipo==="docx"){if(typeof mammoth==="undefined")throw new Error("no se pudo cargar el lector de Word");h=(await mammoth.convertToHtml({arrayBuffer:await blob.arrayBuffer()})).value}
 else if(d.tipo==="md"){if(typeof marked==="undefined")throw new Error("no se pudo cargar el lector de Markdown");h=marked.parse(await blob.text())}
 else if(d.tipo==="html")h=await blob.text();
 else{const p=document.createElement("pre");p.textContent=await blob.text();box.append(p);return}
 if(typeof DOMPurify==="undefined")throw new Error("no se pudo cargar el limpiador de documentos");
 box.innerHTML=limpio(h)}
const SHIM='<script>(function(){try{window.localStorage.length;return}catch(e){}var m={};Object.defineProperty(window,"localStorage",{value:{getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]},clear:function(){m={}}}})})();<\/script>';
function enlace(b){const u=URL.createObjectURL(b);urls.push(u);return u}
function botonEnlace(txt,href,extra){const a=document.createElement("a");a.href=href;a.textContent=txt;Object.assign(a,extra);$("#tools").append(a)}
async function render(){
 const t=++turno,vivo=()=>t===turno;
 urls.forEach(URL.revokeObjectURL);urls=[];
 const id=location.hash.slice(1),lec=$("#lector"),box=$("#lista");
 document.body.classList.toggle("reading",!!id&&!!user);
 document.body.classList.toggle("admin",!!user);
 $("#adm").textContent=user?"Cerrar sesión":"Entrar con mi cuenta";
 $("#adm").hidden=!listo;
 $("#lista").hidden=!!id&&!!user;lec.hidden=!id||!user;$("#tools").hidden=!id||!user;
 lec.textContent="";$("#tools").textContent="";
 if(id&&user){const d=docs.find(x=>x.id===id);color(d?d.asignatura:cur);
  $("#ti").textContent=d?d.titulo:"Documento no encontrado";$("#su").textContent=d?sj(d.asignatura).name+" · "+d.unidad:"";
  $("#bk").textContent="← Mis documentos";$("#bk").href="docs.html"+(cur?"?s="+cur:"");
  if(!d){lec.textContent="Este documento no existe o ya se ha borrado.";return}
  lec.textContent="Cargando…";
  if(d.tipo==="video"){const[ver,baja]=await Promise.all([sb.storage.from(BUCKET).createSignedUrl(d.ruta,10800),sb.storage.from(BUCKET).createSignedUrl(d.ruta,10800,{download:d.nombre})]);if(!vivo())return;
   if(ver.error){lec.textContent="No se pudo abrir: "+textoError(ver.error);return}
   if(!baja.error)botonEnlace("Descargar original",baja.data.signedUrl,{});
   lec.textContent="";const v=document.createElement("video");v.controls=true;v.playsInline=true;v.preload="metadata";v.src=ver.data.signedUrl;lec.append(v);return}
  const r=await sb.storage.from(BUCKET).download(d.ruta);if(!vivo())return;
  if(r.error){lec.textContent="No se pudo abrir: "+textoError(r.error);return}
  botonEnlace("Descargar original",enlace(r.data),{download:d.nombre});
  if(d.tipo==="pdf"||d.tipo==="img")botonEnlace("Abrir en pestaña nueva",enlace(new Blob([r.data],{type:TIPOS[extDe(d.ruta)][1]})),{target:"_blank",rel:"noopener"});
  if(d.tipo==="html"){const b=document.createElement("button");b.type="button";b.textContent="Abrir versión interactiva";b.onclick=async()=>{const t=await r.data.text();lec.textContent="";const n=document.createElement("p");n.textContent="Lo que escribas aquí no se guarda al cerrar. Usa su botón de descarga si lo tiene.";const f=document.createElement("iframe");f.setAttribute("sandbox","allow-scripts allow-modals allow-downloads allow-forms");f.title=d.titulo;f.srcdoc=/<head[^>]*>/i.test(t)?t.replace(/<head[^>]*>/i,m=>m+SHIM):SHIM+t;lec.append(n,f);b.remove()};$("#tools").append(b)}
  lec.textContent="";
  try{await mostrar(lec,d,r.data,vivo)}catch(e){if(vivo()){const p=document.createElement("p");p.textContent="No se pudo mostrar aquí ("+e.message+"). Puedes descargar el original.";lec.append(p)}}
  return}
 color(cur);$("#ti").textContent=cur?sj(cur).name+" · mis documentos":"Mis documentos";
 $("#bk").textContent=cur?"← "+sj(cur).name:"← Todas las asignaturas";$("#bk").href=cur?cur+"/index.html":"index.html";
 $("#su").textContent="Teoría y apuntes: PDF, Word, imágenes, Markdown, HTML y vídeo";
 box.textContent="";
 const aviso=txt=>{const p=document.createElement("p");p.textContent=txt;p.style.color="var(--suave)";box.append(p)};
 if(!sb){aviso("Mis documentos todavía no está conectado a Supabase.");return}
 if(!user){aviso("Entra con tu cuenta para ver tus documentos desde cualquier dispositivo.");return}
 const M=docs.filter(x=>!cur||x.asignatura===cur).sort((a,b)=>(a.asignatura+a.unidad+a.titulo).localeCompare(b.asignatura+b.unidad+b.titulo));
 if(!M.length)aviso("Aún no hay documentos. Añade el primero desde el panel de arriba.");
 let last="",dentro=null;
 for(const d of M){const k=d.asignatura+"|"+d.unidad;
  if(k!==last){const fold=document.createElement("details");fold.className="fold";fold.open=true;fold.style.setProperty("--c",dark?sj(d.asignatura).cd:sj(d.asignatura).c);
   const su=document.createElement("summary"),sn=document.createElement("span"),nb=document.createElement("b"),nm=document.createElement("small");
   nb.textContent=d.unidad;nm.textContent=sj(d.asignatura).name;sn.append(nb,nm);su.append(sn);dentro=document.createElement("div");dentro.className="in";fold.append(su,dentro);box.append(fold);last=k}
  const r=document.createElement("div");r.className="item";
  const a=document.createElement("a");a.href="docs.html"+(cur?"?s="+cur:"")+"#"+d.id;
  const b=document.createElement("b");const tg=document.createElement("i");tg.className="tag";tg.textContent=TAG[d.tipo]||"DOC";tg.style.fontStyle="normal";b.append(tg,d.titulo);
  const sp=document.createElement("span");sp.textContent=new Date(d.creado).toLocaleDateString("es-ES");a.append(b,sp);
  const x=document.createElement("button");x.type="button";x.textContent="Borrar";x.onclick=()=>borrar(d);
  r.append(a,x);dentro.append(r)}}
async function borrar(d){
 if(!confirm("¿Borrar «"+d.titulo+"»?"))return;
 const s=await sb.storage.from(BUCKET).remove([d.ruta]);
 if(s.error){msg("No se pudo borrar: "+textoError(s.error));return}
 const f=await sb.from("documentos").delete().eq("id",d.id);
 if(f.error){msg("No se pudo borrar: "+textoError(f.error));return}
 docs=docs.filter(x=>x.id!==d.id);msg("«"+d.titulo+"» borrado.");render()}

 $("#p1").value=$("#p2").value="";$("#pe").textContent="";

 $("#pc").onclick=()=>fin(false);d.oncancel=()=>res(false);
 $("#pf").onsubmit=async e=>{e.preventDefault();const a=$("#p1").value;$("#pe").textContent="";env.disabled=true;
  let r;
  if(nueva){if(a.length<8){$("#pe").textContent="Mínimo 8 caracteres.";env.disabled=false;return}
   if(a!==$("#p2").value){$("#pe").textContent="No coinciden.";env.disabled=false;return}
   r=await sb.auth.updateUser({password:a}).catch(x=>({error:x}))}
  else r=await sb.auth.signInWithPassword({email:$("#pm").value.trim(),password:a}).catch(x=>({error:x}));
  env.disabled=false;
  if(r.error){$("#pe").textContent=textoError(r.error);return}
  fin(true)};
 d.showModal();setTimeout(()=>(nueva?$("#p1"):$("#pm")).focus(),50)})}
function limpiaProgreso(){const G={programacion:["fc-known"],"lenguajes-de-marcas":["lm:"],ingles:["en:"],transformacion:["tsp:"],"bases-de-datos":["bd:"]};try{for(const p in G){let m={};try{m=JSON.parse(localStorage.getItem("sync:"+p))||{}}catch(e){}if(m.dirty)continue;for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(G[p].some(x=>k.startsWith(x)))localStorage.removeItem(k)}localStorage.removeItem("sync:"+p)}}catch(e){}}

 if((nuevo&&nuevo.id)===(user&&user.id))return;
 user=nuevo;docs=[];
 if(user){try{await cargar();await revisarLocales()}catch(e){msg(textoError(e))}}
 render()}
(async()=>{

 $("#cp").onclick=async()=>{if(await dialogo("cambiar"))msg("Contraseña cambiada.")};
 $("#ad").onclick=async()=>{const fs=[...$("#af").files];if(!fs.length){msg("Elige primero algún archivo.");return}
  const u=$("#au").value.trim()||"Sin unidad",boton=$("#ad");let n=0;const mal=[];boton.disabled=true;
  for(const[i,f]of fs.entries()){msg("Subiendo "+(i+1)+" de "+fs.length+": "+f.name+"…");
   try{await subir(f,$("#as").value,u);n++}catch(e){mal.push(f.name+": "+textoError(e))}}

 $("#mv").onclick=async()=>{const L=await leerLocal();$("#mv").disabled=true;
  const r=await moverAntiguos(L,d=>borrarLocal(d.id));$("#mv").disabled=false;await cargar().catch(()=>{});await revisarLocales();
  msg(r.n+" documento(s) movido(s) a la nube."+(r.mal.length?" Fallaron: "+r.mal.join(" · "):""));render()};
 $("#im").onclick=()=>$("#imf").click();
 $("#imf").onchange=async e=>{const f=e.target.files[0];if(!f)return;e.target.value="";
  try{const L=JSON.parse(await f.text());if(!Array.isArray(L))throw 0;
   for(const d of L)if(typeof d.data==="string"&&d.data.startsWith("data:")){d.blob=await (await fetch(d.data)).blob();delete d.data}
   const r=await moverAntiguos(L.filter(d=>d&&(d.blob||d.html)));await cargar().catch(()=>{});
   msg(r.n+" documento(s) restaurado(s)."+(r.mal.length?" Fallaron: "+r.mal.join(" · "):""));render()}
  catch(x){msg("Copia no válida.")}};
 sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>alCambiarUsuario(s?s.user:null),0)});
