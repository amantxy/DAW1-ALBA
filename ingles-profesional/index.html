:root{--bg:#f3f6fb;--hoja:#fff;--tinta:#0f1b2d;--suave:#52637a;--linea:#d7e0ec;--c:#ca8a04;--cs:color-mix(in srgb,var(--c) 12%,var(--hoja))}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--hoja:#131c2e;--tinta:#e8eef8;--suave:#9aabc4;--linea:#25324a;--c:#f5c542;--cs:color-mix(in srgb,var(--c) 16%,var(--hoja));color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tinta);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}

.back:hover{text-decoration:underline}

a.card{transition:transform .15s,box-shadow .15s}
.card b{display:block;font-size:1.1rem;color:var(--c);margin-bottom:2px}
.card span{color:var(--suave);font-size:.9rem}
.card .ico{position:absolute;right:14px;top:12px;font:700 1.3rem ui-monospace,Consolas,monospace;color:var(--c);opacity:.35}
.card.off{opacity:.5;border-top-style:dashed}
details.fold{position:relative;margin:32px 0 18px;--f:color-mix(in srgb,var(--c) 20%,var(--hoja))}
details.fold>summary{list-style:none;cursor:pointer;position:relative;display:flex;align-items:center;gap:12px;min-height:72px;padding:16px 18px;background:var(--f);border:2px solid var(--c);border-radius:0 12px 12px 12px}
details.fold>summary::before{content:"";position:absolute;left:-2px;bottom:100%;width:min(46%,170px);height:17px;background:var(--c);border-radius:10px 0 0 0;clip-path:polygon(0 0,84% 0,100% 100%,0 100%)}

details.fold>summary>svg{display:none}
details.fold>summary b{font-size:1.15rem}
details.fold>summary small{display:block;color:var(--suave);font-size:.88rem}
details.fold>summary::after{content:"▾";margin-left:auto;color:var(--tinta);transition:transform .2s}
details.fold[open]>summary{border-radius:0 12px 0 0}
details.fold[open]>summary::after{transform:rotate(180deg)}
.in{padding:14px 16px 18px;background:var(--hoja);border:2px solid var(--c);border-top:0;border-radius:0 0 12px 12px}
.in h3{margin:14px 0 8px;font-size:.95rem;color:var(--c);display:flex;align-items:center;gap:8px}
.in h3 svg{width:20px;height:20px}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr))}
a.t,div.t{display:block;background:var(--cs);border:1px solid var(--linea);border-radius:10px;padding:12px 14px;color:inherit;text-decoration:none;min-height:64px}
a.t:hover,a.t:focus-visible{border-color:var(--c);outline:none}
.t b{display:block;font-size:.98rem}
.t span{color:var(--suave);font-size:.82rem}
div.t{opacity:.5;border-style:dashed}
.sub{position:relative;margin-top:26px;padding:6px 12px 14px;background:var(--cs);border:1.5px solid var(--c);border-radius:0 10px 10px 10px}
.sub::before{content:"";position:absolute;left:-1.5px;bottom:100%;width:min(46%,130px);height:13px;background:var(--c);border-radius:8px 0 0 0;clip-path:polygon(0 0,84% 0,100% 100%,0 100%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
